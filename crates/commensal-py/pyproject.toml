[build-system]
requires      = ["maturin>=1.4,<2"]
build-backend = "maturin"

[project]
name            = "commensal"
dynamic         = ["version"]
description     = "Gut commensal analysis: amplicon sequences, consortium dynamics, and host receptor kinetics (pure Rust, Python bindings)"
license         = "Apache-2.0"
license-files   = ["LICENSE"]
requires-python = ">=3.10"
keywords        = ["amplicon-sequencing", "chemostat", "flagellin", "tlr5", "microbiome"]
authors         = [{ name = "Alejandro Soto Franco", email = "sotofranco.eng@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]
dependencies = ["numpy>=1.24"]

[dependency-groups]
dev = ["pytest"]

[tool.maturin]
python-source = "python"
module-name   = "commensal._core"
bindings      = "pyo3"
features      = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
# The package source lives under python/, next to the Rust src/ that
# pyrefly would otherwise infer as the import root.
search-path = ["python"]
project-includes = ["python", "tests"]
